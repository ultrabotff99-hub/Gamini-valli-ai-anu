name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Arrange files (works for flat or folder upload)
        run: |
          mkdir -p lib
          if [ -f main.dart ]; then cp main.dart lib/main.dart; fi

      - name: Initialize Android Project Structure
        run: flutter create . --project-name=ai_girlfriend --org=com.aigf --platforms=android

      - name: Permissions, min SDK and Gradle fix
        run: |
          python3 - <<'PY'
          import glob
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "RECORD_AUDIO" not in s:
              perms = '''<uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.BLUETOOTH"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
              </queries>
              <application'''
              s = s.replace("<application", perms, 1)
              open(p, "w").write(s)
          for g in glob.glob("android/app/build.gradle*"):
              t = open(g).read().replace("flutter.minSdkVersion", "24")
              open(g, "w").write(t)
          with open("android/gradle.properties", "a") as f:
              f.write("\nandroid.newDsl=false\nandroid.builtInKotlin=false\nandroid.enableLegacyVariantApi=true\n")
          print("patched")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release, auto retry)
        run: |
          for i in 1 2; do
            flutter build apk --release && exit 0
            echo "Attempt $i failed, retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
